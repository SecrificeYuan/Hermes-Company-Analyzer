openapi: 3.1.0
info:
  title: Hermes Company Analyzer API
  version: v1
  description: Frozen v1 contract for the single-machine Next.js and SQLite MVP.
paths:
  /v1/company-candidates:
    get:
      operationId: searchCompanyCandidates
      summary: Resolve a company name or stock code before creating an analysis job
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: A-share candidates
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [candidates]
                properties:
                  candidates:
                    type: array
                    items: { $ref: '#/components/schemas/CompanyIdentity' }
  /v1/analysis-jobs:
    post:
      operationId: createAnalysisJob
      summary: Persist an online analysis job for the single Worker to process
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAnalysisJobRequest' }
      responses:
        '202':
          description: Job persisted in SQLite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisJob' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/analysis-jobs/{jobId}:
    get:
      operationId: getAnalysisJob
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses:
        '200':
          description: Current SQLite-backed job state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisJob' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/analyses/{analysisId}:
    get:
      operationId: getAnalysisReport
      parameters: [{ $ref: '#/components/parameters/AnalysisId' }]
      responses:
        '200':
          description: Completed or partial report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisReport' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    JobId: { name: jobId, in: path, required: true, schema: { type: string, minLength: 1 } }
    AnalysisId: { name: analysisId, in: path, required: true, schema: { type: string, minLength: 1 } }
  responses:
    ValidationError:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    CreateAnalysisJobRequest:
      type: object
      additionalProperties: false
      required: [company]
      properties: { company: { $ref: '#/components/schemas/CompanyIdentity' } }
    CompanyIdentity:
      type: object
      additionalProperties: false
      required: [name, stockCode, market]
      properties:
        name: { type: string }
        stockCode: { type: string, pattern: '^\\d{6}$' }
        market: { const: A_SHARE }
        industry: { type: string }
    AnalysisJob:
      type: object
      additionalProperties: false
      required: [schemaVersion, jobId, status, company, progress, errors, attempt, leaseExpiresAt, createdAt, updatedAt, pollAfterMs]
      properties:
        schemaVersion: { const: v1 }
        jobId: { type: string }
        status: { type: string, enum: [queued, resolving, fetching, normalizing, analyzing, generating_narrative, succeeded, partial, failed] }
        company: { $ref: '#/components/schemas/CompanyIdentity' }
        progress: { $ref: '#/components/schemas/JobProgress' }
        analysisId: { type: string }
        errors: { type: array, items: { $ref: '#/components/schemas/JobError' } }
        attempt: { type: integer, minimum: 0 }
        leaseExpiresAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        pollAfterMs: { type: integer, minimum: 500, maximum: 10000, default: 1500 }
      allOf:
        - if: { properties: { status: { enum: [succeeded, partial] } }, required: [status] }
          then: { required: [analysisId] }
        - if: { properties: { status: { const: failed } }, required: [status] }
          then: { not: { required: [analysisId] } }
    JobProgress:
      type: object
      additionalProperties: false
      required: [stage, message]
      properties:
        stage: { type: string, enum: [queued, resolving, fetching, normalizing, analyzing, generating_narrative, completed] }
        message: { type: string, description: Chinese user-facing progress text }
    JobError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: { type: string, enum: [company_not_found, ambiguous_company, source_unavailable, source_timeout, rate_limited, invalid_data, analysis_failed, llm_unavailable, internal_error] }
        message: { type: string }
        sourceId: { type: string }
        dimension: { type: string, enum: [financial_health, debt_credit, operations_reputation] }
        retryable: { type: boolean }
    AnalysisReport:
      type: object
      additionalProperties: false
      required: [schemaVersion, analysisId, generatedAt, company, overallAssessment, dimensions, events, evidence, coverage, narrative, visualizations]
      properties:
        schemaVersion: { const: v1 }
        analysisId: { type: string }
        generatedAt: { type: string, format: date-time }
        company: { $ref: '#/components/schemas/CompanyIdentity' }
        overallAssessment: { $ref: '#/components/schemas/OverallAssessment' }
        dimensions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DimensionReport' } }
        events: { type: array, items: { $ref: '#/components/schemas/TimelineEvent' } }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        coverage: { type: array, items: { $ref: '#/components/schemas/DataCoverage' } }
        narrative: { $ref: '#/components/schemas/LlmNarrative' }
        visualizations: { type: array, items: { $ref: '#/components/schemas/VisualizationSpec' } }
    OverallAssessment:
      type: object
      additionalProperties: false
      required: [riskLevel, summary, keySignals, evidenceIds]
      properties:
        riskLevel: { type: string, enum: [low, medium, high, unknown] }
        summary: { type: string }
        keySignals: { type: array, items: { $ref: '#/components/schemas/Signal' } }
        evidenceIds: { type: array, minItems: 1, items: { type: string } }
    DimensionReport:
      type: object
      additionalProperties: false
      required: [id, label, status, riskLevel, summary, signals, metricSeries, eventIds]
      properties:
        id: { type: string, enum: [financial_health, debt_credit, operations_reputation] }
        label: { type: string }
        status: { type: string, enum: [complete, partial, unavailable] }
        riskLevel: { type: string, enum: [low, medium, high, unknown] }
        summary: { type: string }
        signals: { type: array, items: { $ref: '#/components/schemas/Signal' } }
        metricSeries: { type: array, items: { $ref: '#/components/schemas/MetricSeries' } }
        eventIds: { type: array, items: { type: string } }
    Signal:
      type: object
      additionalProperties: false
      required: [id, severity, title, explanation, evidenceIds]
      properties:
        id: { type: string }
        severity: { type: string, enum: [positive, info, warning, critical] }
        title: { type: string }
        explanation: { type: string }
        formula: { type: string }
        evidenceIds: { type: array, minItems: 1, items: { type: string } }
    MetricSeries:
      type: object
      additionalProperties: false
      required: [id, label, unit, points]
      properties:
        id: { type: string, enum: [revenue, net_profit, operating_cash_flow, debt_to_asset_ratio, current_ratio, receivables] }
        label: { type: string }
        unit: { type: string, enum: [CNY, percent, ratio] }
        formula: { type: string }
        points: { type: array, items: { $ref: '#/components/schemas/MetricPoint' } }
    MetricPoint:
      type: object
      additionalProperties: false
      required: [period, value, evidenceIds]
      properties: { period: { type: string }, value: { type: number }, evidenceIds: { type: array, minItems: 1, items: { type: string } } }
    TimelineEvent:
      type: object
      additionalProperties: false
      required: [id, category, claimKind, occurredAt, title, summary, evidenceIds]
      properties:
        id: { type: string }
        category: { type: string, enum: [announcement, judicial_or_administrative, news, reputation] }
        claimKind: { type: string, enum: [fact, opinion] }
        occurredAt: { type: string, format: date-time }
        title: { type: string }
        summary: { type: string }
        severity: { type: string, enum: [positive, info, warning, critical] }
        evidenceIds: { type: array, minItems: 1, items: { type: string } }
    Evidence:
      type: object
      additionalProperties: false
      required: [id, category, claimKind, sourceName, sourceUrl, retrievedAt, title, provenance, extraction]
      properties:
        id: { type: string }
        category: { type: string, enum: [financial_statement, exchange_announcement, judicial_or_administrative, news, company_profile, reputation] }
        claimKind: { type: string, enum: [fact, opinion] }
        sourceName: { type: string }
        sourceUrl: { type: string, format: uri }
        retrievedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        title: { type: string }
        excerpt: { type: string }
        provenance: { $ref: '#/components/schemas/SourceProvenance' }
        extraction: { $ref: '#/components/schemas/Extraction' }
    SourceProvenance:
      type: object
      additionalProperties: false
      required: [sourceType, accessMethod, adapterId, reliabilityTier]
      properties:
        sourceType: { type: string, enum: [official_api, official_web, open_data, web_page, social_platform] }
        accessMethod: { type: string, enum: [structured_api, html_parser, open_source_tool, llm_assisted, manual_import] }
        adapterId: { type: string }
        reliabilityTier: { type: string, enum: [official, third_party, community] }
        contentHash: { type: string }
    Extraction:
      type: object
      additionalProperties: false
      required: [method, verificationStatus]
      properties:
        method: { type: string, enum: [structured_api, html_parser, open_source_tool, llm_assisted, manual_import] }
        extractionConfidence: { type: number, minimum: 0, maximum: 1 }
        verificationStatus: { type: string, enum: [verified, unverified, rejected] }
      allOf:
        - if: { properties: { method: { const: llm_assisted } }, required: [method] }
          then: { required: [extractionConfidence] }
    LlmNarrative:
      type: object
      additionalProperties: false
      required: [generationStatus, sections]
      properties:
        generationStatus: { type: string, enum: [complete, fallback, unavailable] }
        provider: { type: string }
        model: { type: string }
        sections: { type: array, items: { $ref: '#/components/schemas/NarrativeSection' } }
    NarrativeSection:
      type: object
      additionalProperties: false
      required: [id, title, content, evidenceIds]
      properties: { id: { type: string }, title: { type: string }, content: { type: string }, evidenceIds: { type: array, minItems: 1, items: { type: string } } }
    VisualizationSpec:
      type: object
      additionalProperties: false
      required: [id, dimension, chartType, title, description, metricSeriesIds, eventIds, evidenceIds, timeRange, emptyState]
      properties:
        id: { type: string, pattern: '^[a-z0-9-]+$' }
        dimension: { type: string, enum: [financial_health, debt_credit, operations_reputation] }
        chartType: { type: string, enum: [line, bar, stacked_bar, area, radar, timeline, table] }
        title: { type: string }
        description: { type: string }
        metricSeriesIds: { type: array, items: { type: string } }
        eventIds: { type: array, items: { type: string } }
        evidenceIds: { type: array, minItems: 1, items: { type: string } }
        timeRange:
          type: object
          additionalProperties: false
          required: [start, end]
          properties: { start: { type: string }, end: { type: string } }
        emptyState:
          type: object
          additionalProperties: false
          required: [isEmpty, message]
          properties: { isEmpty: { type: boolean }, message: { type: string } }
    DataCoverage:
      type: object
      additionalProperties: false
      required: [dimension, status, retrievedAt]
      properties:
        dimension: { type: string, enum: [financial_health, debt_credit, operations_reputation] }
        status: { type: string, enum: [complete, partial, unavailable] }
        reason: { type: string }
        retrievedAt: { type: string, format: date-time }
        sourceNames: { type: array, items: { type: string } }
      allOf:
        - if: { properties: { status: { const: unavailable } }, required: [status] }
          then: { required: [reason] }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties: { code: { type: string }, message: { type: string } }
